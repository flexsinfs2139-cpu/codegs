<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title><?= mode === 'dsr' ? 'Select Date for DSR' : 'Select Date for Tasks' ?></title>
  <!-- Google Fonts: Varela Round & Roboto Mono matching WorkSheet design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Varela+Round&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-text: 'Varela Round', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-digits: 'Roboto Mono', monospace;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --weekend-color: #ef4444;
      --today-color: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-page);
      font-family: var(--font-text);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .cal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
    }

    .cal-header-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .cal-badge-mode {
      font-family: var(--font-digits);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #ede9fe;
      color: #6366f1;
      letter-spacing: 0.05em;
    }

    /* Month Navigation */
    .month-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    .nav-btn:hover {
      background: #f1f5f9;
      color: var(--text-main);
      border-color: #cbd5e1;
    }

    .nav-btn:focus-visible {
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
    }

    .month-year-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    /* Days of Week */
    .weekdays-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-bottom: 6px;
    }

    .weekday-label {
      font-family: var(--font-digits);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .weekday-label.weekend {
      color: var(--weekend-color);
    }

    /* Days Grid */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 12px;
    }

    .day-cell {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-family: var(--font-digits);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.12s ease-in-out;
      border: 1px solid transparent;
      outline: none;
    }

    .day-cell:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .day-cell:focus-visible {
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5);
    }

    .day-cell.other-month {
      color: #cbd5e1;
    }

    .day-cell.weekend:not(.other-month):not(.selected) {
      color: #b91c1c;
      font-weight: 600;
    }

    .day-cell.today {
      border-color: var(--primary);
      font-weight: 700;
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .day-cell.selected {
      background-color: var(--primary) !important;
      color: #ffffff !important;
      font-weight: 700;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.35);
    }

    /* Selected Date Display */
    .selected-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .selected-bar-title {
      color: var(--text-muted);
      font-weight: 600;
    }

    .selected-bar-date {
      color: var(--text-main);
      font-family: var(--font-digits);
      font-weight: 700;
    }

    /* Footer Buttons */
    .cal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      font-family: var(--font-text);
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
      border: 1px solid transparent;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      flex: 1.4;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-today {
      background: #ffffff;
      color: var(--primary);
      border-color: #c7d2fe;
      flex: 0.8;
    }

    .btn-today:hover {
      background: var(--primary-light);
    }

    .btn-cancel {
      background: #ffffff;
      color: var(--text-muted);
      border-color: var(--border-color);
      flex: 0.8;
    }

    .btn-cancel:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .hint-text {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="cal-card" role="dialog" aria-modal="true" aria-labelledby="calTitle">
    <!-- Header -->
    <div class="cal-header">
      <div class="cal-header-title" id="calTitle">
        <span><?= mode === 'dsr' ? '📊' : '⚡' ?></span>
        <span><?= mode === 'dsr' ? 'Select Date for DSR' : 'Select Date for Tasks' ?></span>
      </div>
      <span class="cal-badge-mode"><?= (mode || 'tasks').toUpperCase() ?></span>
    </div>

    <!-- Month Navigation -->
    <div class="month-nav-bar">
      <button class="nav-btn" onclick="prevMonth()" title="Previous Month (PageUp or [)" aria-label="Previous Month">◀</button>
      <div class="month-year-label" id="monthYearLabel" aria-live="polite"></div>
      <button class="nav-btn" onclick="nextMonth()" title="Next Month (PageDown or ])" aria-label="Next Month">▶</button>
    </div>

    <!-- Days of Week (Mon - Sun) -->
    <div class="weekdays-row" aria-hidden="true">
      <span class="weekday-label">Mo</span>
      <span class="weekday-label">Tu</span>
      <span class="weekday-label">We</span>
      <span class="weekday-label">Th</span>
      <span class="weekday-label">Fr</span>
      <span class="weekday-label weekend">Sa</span>
      <span class="weekday-label weekend">Su</span>
    </div>

    <!-- Calendar Days Grid -->
    <div class="days-grid" id="daysGrid" role="grid" tabindex="0" aria-label="Calendar days grid"></div>

    <!-- Selected Date Preview -->
    <div class="selected-bar">
      <span class="selected-bar-title">Selected Date:</span>
      <span class="selected-bar-date" id="selectedDateText"></span>
    </div>

    <!-- Footer Actions -->
    <div class="cal-footer">
      <button class="btn btn-today" onclick="selectToday()" title="Jump to Today">Today</button>
      <button class="btn btn-cancel" onclick="google.script.host.close()">Cancel</button>
      <button id="proceedBtn" class="btn btn-primary" onclick="confirmSelection()">
        <?= mode === 'dsr' ? '📋 Generate DSR' : '📝 Fill Tasks' ?>
      </button>
    </div>

    <div class="hint-text">💡 Tip: Double-click any date or press <strong>Enter</strong> to confirm</div>
  </div>

  <script>
    // Injected template data (with fallback support)
    const config = <?!= JSON.stringify(typeof dateInfo !== 'undefined' ? dateInfo : {}) ?>;

    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const todayObj = new Date();
    const todayYear = todayObj.getFullYear();
    const todayMonth = todayObj.getMonth();
    const todayDay = todayObj.getDate();

    let viewYear = config.year || todayYear;
    let viewMonth = typeof config.monthIndex === 'number' ? config.monthIndex : todayMonth;

    let selectedYear = config.year || todayYear;
    let selectedMonth = typeof config.monthIndex === 'number' ? config.monthIndex : todayMonth;
    let selectedDay = config.day || todayDay;

    window.onload = function() {
      renderCalendar();
      updateSelectedDateDisplay();
    };

    function prevMonth() {
      viewMonth--;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      }
      renderCalendar();
    }

    function nextMonth() {
      viewMonth++;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      renderCalendar();
    }

    function selectToday() {
      viewYear = todayYear;
      viewMonth = todayMonth;
      selectedYear = todayYear;
      selectedMonth = todayMonth;
      selectedDay = todayDay;
      renderCalendar();
      updateSelectedDateDisplay();
    }

    function renderCalendar() {
      document.getElementById('monthYearLabel').innerText =
        MONTH_NAMES[viewMonth] + ' ' + viewYear;

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const firstDayDate = new Date(viewYear, viewMonth, 1);
      const startOffset = (firstDayDate.getDay() + 6) % 7; // Monday start
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

      // 1. Previous month trailing days
      for (let i = startOffset - 1; i >= 0; i--) {
        const d = prevMonthDays - i;
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerText = d;
        cell.onclick = (function(prevM, prevY, dayNum) {
          return function() {
            viewMonth = prevM;
            viewYear = prevY;
            selectDate(prevY, prevM, dayNum);
          };
        })(viewMonth === 0 ? 11 : viewMonth - 1, viewMonth === 0 ? viewYear - 1 : viewYear, d);
        grid.appendChild(cell);
      }

      // 2. Current month days
      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = d;
        cell.setAttribute('role', 'gridcell');

        const dayOfWeek = (startOffset + (d - 1)) % 7;
        if (dayOfWeek === 5 || dayOfWeek === 6) {
          cell.classList.add('weekend');
        }

        if (viewYear === todayYear && viewMonth === todayMonth && d === todayDay) {
          cell.classList.add('today');
          cell.title = 'Today';
        }

        if (viewYear === selectedYear && viewMonth === selectedMonth && d === selectedDay) {
          cell.classList.add('selected');
          cell.setAttribute('aria-selected', 'true');
        }

        cell.onclick = (function(y, m, dayNum) {
          return function() {
            selectDate(y, m, dayNum);
          };
        })(viewYear, viewMonth, d);

        cell.ondblclick = (function(y, m, dayNum) {
          return function() {
            selectDate(y, m, dayNum);
            confirmSelection();
          };
        })(viewYear, viewMonth, d);

        grid.appendChild(cell);
      }

      // 3. Next month leading days
      const totalCells = startOffset + daysInMonth;
      const nextMonthSlots = (7 - (totalCells % 7)) % 7;
      for (let d = 1; d <= nextMonthSlots; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerText = d;
        cell.onclick = (function(nextM, nextY, dayNum) {
          return function() {
            viewMonth = nextM;
            viewYear = nextY;
            selectDate(nextY, nextM, dayNum);
          };
        })(viewMonth === 11 ? 0 : viewMonth + 1, viewMonth === 11 ? viewYear + 1 : viewYear, d);
        grid.appendChild(cell);
      }
    }

    function selectDate(y, m, d) {
      selectedYear = y;
      selectedMonth = m;
      selectedDay = d;
      renderCalendar();
      updateSelectedDateDisplay();
    }

    function updateSelectedDateDisplay() {
      const d = new Date(selectedYear, selectedMonth, selectedDay);
      const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('selectedDateText').innerText =
        d.toLocaleDateString('en-GB', options);
    }

    function confirmSelection() {
      const proceedBtn = document.getElementById('proceedBtn');
      proceedBtn.disabled = true;
      const originalText = proceedBtn.innerText;
      proceedBtn.innerText = '⏳ Opening...';

      const mm = (selectedMonth + 1 < 10 ? '0' : '') + (selectedMonth + 1);
      const dd = (selectedDay < 10 ? '0' : '') + selectedDay;
      const dateStr = selectedYear + '-' + mm + '-' + dd;

      google.script.run
        .withFailureHandler(function(err) {
          proceedBtn.disabled = false;
          proceedBtn.innerText = originalText;
          alert('Error: ' + (err.message || err));
        })
        .proceedFromCalendar({
          mode: config.mode || 'tasks',
          dateStr: dateStr
        });
    }

    // Keyboard Shortcuts & Navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        google.script.host.close();
      } else if (e.key === 'Enter') {
        confirmSelection();
      } else if (e.key === 'ArrowLeft') {
        changeDay(-1);
      } else if (e.key === 'ArrowRight') {
        changeDay(1);
      } else if (e.key === 'ArrowUp') {
        changeDay(-7);
      } else if (e.key === 'ArrowDown') {
        changeDay(7);
      } else if (e.key === 'PageUp' || e.key === '[') {
        prevMonth();
      } else if (e.key === 'PageDown' || e.key === ']') {
        nextMonth();
      }
    });

    function changeDay(delta) {
      const cur = new Date(selectedYear, selectedMonth, selectedDay + delta);
      selectedYear = cur.getFullYear();
      selectedMonth = cur.getMonth();
      selectedDay = cur.getDate();
      viewYear = selectedYear;
      viewMonth = selectedMonth;
      renderCalendar();
      updateSelectedDateDisplay();
    }
  </script>
</body>
</html>
